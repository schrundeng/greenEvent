services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: greenevent_app
    ports:
      - "8000:80"
    environment:
      - APP_NAME=GreenEvent
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost:8000
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=greenevent
      - DB_USERNAME=postgres
      - DB_PASSWORD=secret
      - SESSION_DRIVER=database
      - CACHE_STORE=database
      - RUN_MIGRATIONS=true
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: greenevent_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: greenevent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d greenevent"]
      interval: 3s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
